# learnchinese.today — itcsVM3 (Cloudflare proxied, Full strict → nginx :443 → Node 127.0.0.1:34827)
# Origin cert: /etc/nginx/ssl/learnchinese.{crt,key} (Cloudflare Origin CA)
# IP directo / SNI errado: itcs-default.conf (443 default_server ssl_reject_handshake)
# Instalado por: web/scripts/prepare-prod-server.sh

# --- HTTP :80 — só estes hostnames (não default_server) ---
server {
    listen 80;
    listen [::]:80;
    server_name learnchinese.today www.learnchinese.today learnchinese.page www.learnchinese.page;
    return 301 https://learnchinese.today$request_uri;
}

# --- HTTPS :443 — apex ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name learnchinese.today;

    ssl_certificate     /etc/nginx/ssl/learnchinese.crt;
    ssl_certificate_key /etc/nginx/ssl/learnchinese.key;

    location / {
        proxy_pass http://127.0.0.1:34827;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- HTTPS :443 — www / .page → apex ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.learnchinese.today learnchinese.page www.learnchinese.page;

    ssl_certificate     /etc/nginx/ssl/learnchinese.crt;
    ssl_certificate_key /etc/nginx/ssl/learnchinese.key;

    return 301 https://learnchinese.today$request_uri;
}
