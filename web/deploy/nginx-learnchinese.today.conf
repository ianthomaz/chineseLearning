# learnchinese.today — itcsVM3 (Cloudflare proxied → nginx :80 → Node 127.0.0.1:34827)
# learnchinese.page → 301 na Cloudflare (ruleset); bloco abaixo = fallback no origin.
# Instalado por: web/scripts/prepare-prod-server.sh

# --- HTTP :80 — apex ---
server {
    listen 80;
    listen [::]:80;
    server_name learnchinese.today;

    location / {
        proxy_pass http://127.0.0.1:34827;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- HTTP :80 — www → apex ---
server {
    listen 80;
    listen [::]:80;
    server_name www.learnchinese.today;
    return 301 https://learnchinese.today$request_uri;
}

# --- HTTP :80 — learnchinese.page → apex (fallback se CF ruleset falhar) ---
server {
    listen 80;
    listen [::]:80;
    server_name learnchinese.page www.learnchinese.page;
    return 301 https://learnchinese.today$request_uri;
}
