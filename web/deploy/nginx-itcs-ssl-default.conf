# Shared host — reject HTTPS when SNI is not a known vhost (IP directo, scan, etc.)
# Do NOT edit itcs-default.conf — this file is loaded separately.
# Requires nginx >= 1.19.4 (ssl_reject_handshake).

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
